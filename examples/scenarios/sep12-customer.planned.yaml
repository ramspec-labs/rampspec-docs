apiVersion: rampspec.dev/v1
kind: Scenario
metadata:
  id: sep12-customer-lifecycle
  title: SEP-12 synthetic customer lifecycle
  labels:
    availability: planned
    protocol: sep12
spec:
  networks: [testnet]
  requires:
    seps: [1, 10, 12]
    capabilities: [synthetic-customer]
  parameters:
    target: { type: target-ref, required: true }
    credential: { type: secret-ref, required: true }
  fixtures:
    customer:
      uses: synthetic-natural-person
      with:
        locale: en
  steps:
    - id: authenticate
      uses: sep10.authenticate
      with:
        target: "${{ parameters.target }}"
        credential: "${{ parameters.credential }}"
    - id: discover-fields
      uses: sep12.get-customer
      needs: [authenticate]
    - id: submit-customer
      uses: sep12.put-customer
      needs: [discover-fields]
      with:
        customer: "${{ fixtures.customer.id }}"
    - id: wait-for-status
      uses: sep12.wait-for-status
      needs: [submit-customer]
      timeout: 5m
  cleanup:
    - id: delete-customer
      uses: sep12.delete-customer
      needs: [submit-customer]
      always: true
    - id: verify-deletion
      uses: sep12.verify-deletion
      needs: [delete-customer]
      always: true
  policy:
    failOn: [critical, high]
    maximumDuration: 8m
    retainTraffic: 1d
    allowedTargetRefs: ["${{ parameters.target }}"]
