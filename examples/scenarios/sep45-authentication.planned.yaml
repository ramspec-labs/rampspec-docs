apiVersion: rampspec.dev/v1
kind: Scenario
metadata:
  id: sep45-authentication
  title: SEP-45 opt-in authentication
  labels:
    availability: planned
    protocol: sep45
spec:
  networks: [testnet]
  requires:
    seps: [1, 45]
    capabilities: [stellar-signing]
  parameters:
    target: { type: target-ref, required: true }
    signer: { type: secret-ref, required: true }
  steps:
    - id: discover
      uses: sep1.discover
      with:
        target: "${{ parameters.target }}"
    - id: request
      uses: sep45.request-challenge
      needs: [discover]
    - id: authenticate
      uses: sep45.sign-and-exchange
      needs: [request]
      with:
        challenge: "${{ steps.request.challenge }}"
        signer: "${{ parameters.signer }}"
  cleanup:
    - id: revoke-session
      uses: auth.revoke-fixture-session
      needs: [authenticate]
      always: true
  policy:
    draftRules: blocking
    failOn: [critical, high]
    maximumDuration: 3m
    allowedTargetRefs: ["${{ parameters.target }}"]
