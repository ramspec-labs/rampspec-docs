name: Sync contract artifacts

on:
  repository_dispatch:
    types: [contracts-artifacts-released]
  workflow_dispatch:
    inputs:
      contracts_tag:
        description: Immutable contracts release tag
        required: true
        type: string
      contracts_commit:
        description: Full lowercase contracts commit SHA
        required: true
        type: string
      artifact_sha256:
        description: Expected lowercase SHA-256 of contracts.json
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify contracts tag and download release artifact
        env:
          GH_TOKEN: ${{ secrets.RAMPSPEC_CONTRACTS_READ_TOKEN }}
          CONTRACTS_TAG: ${{ inputs.contracts_tag || github.event.client_payload.contracts_tag }}
          EXPECTED_COMMIT: ${{ inputs.contracts_commit || github.event.client_payload.contracts_commit }}
        shell: bash
        run: |
          test -n "$GH_TOKEN"
          actual_commit="$(gh api "repos/rampspec-labs/rampspec-contracts/commits/$CONTRACTS_TAG" --jq .sha)"
          test "$actual_commit" = "$EXPECTED_COMMIT"
          mkdir -p .artifacts
          gh release download "$CONTRACTS_TAG" \
            --repo rampspec-labs/rampspec-contracts \
            --pattern contracts.json \
            --dir .artifacts
      - name: Import pinned artifact
        run: >-
          npm run import:contracts --
          --source .artifacts/contracts.json
          --tag "${{ inputs.contracts_tag || github.event.client_payload.contracts_tag }}"
          --commit "${{ inputs.contracts_commit || github.event.client_payload.contracts_commit }}"
          --sha256 "${{ inputs.artifact_sha256 || github.event.client_payload.artifact_sha256 }}"
      - run: npm test
      - run: npm run lint:contracts
      - name: Open generated reference pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: generated/contracts-${{ github.run_id }}
        shell: bash
        run: |
          if git diff --quiet -- generated/contract-specs; then
            echo "No generated contract change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git add generated/contract-specs
          git commit -m "Refresh generated contract reference"
          git push --set-upstream origin "$BRANCH_NAME"
          gh pr create \
            --title "Refresh generated contract reference" \
            --body "Imports pinned contract specs, bindings, hashes, and deployment metadata." \
            --base main \
            --head "$BRANCH_NAME"
