name: Sync backend schemas

on:
  workflow_dispatch:
    inputs:
      backend_tag:
        description: Immutable backend release tag
        required: true
        type: string
      backend_commit:
        description: Full lowercase backend commit SHA
        required: true
        type: string
      artifact_sha256:
        description: Expected lowercase SHA-256 of schemas.json
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify backend tag and download release artifact
        env:
          GH_TOKEN: ${{ secrets.RAMPSPEC_BACKEND_READ_TOKEN }}
          BACKEND_TAG: ${{ inputs.backend_tag }}
          EXPECTED_COMMIT: ${{ inputs.backend_commit }}
        shell: bash
        run: |
          test -n "$GH_TOKEN"
          actual_commit="$(gh api "repos/rampspec-labs/rampspec-backend/commits/$BACKEND_TAG" --jq .sha)"
          test "$actual_commit" = "$EXPECTED_COMMIT"
          mkdir -p .artifacts
          gh release download "$BACKEND_TAG" \
            --repo rampspec-labs/rampspec-backend \
            --pattern schemas.json \
            --dir .artifacts
      - name: Import pinned artifact
        run: >-
          npm run import:schemas --
          --source .artifacts/schemas.json
          --tag "${{ inputs.backend_tag }}"
          --commit "${{ inputs.backend_commit }}"
          --sha256 "${{ inputs.artifact_sha256 }}"
      - run: npm test
      - run: npm run lint:schemas
      - name: Open generated reference pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: generated/schemas-${{ github.run_id }}
        shell: bash
        run: |
          if git diff --quiet -- generated/schemas; then
            echo "No generated schema change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git add generated/schemas
          git commit -m "Refresh generated schema reference"
          git push --set-upstream origin "$BRANCH_NAME"
          gh pr create \
            --title "Refresh generated schema reference" \
            --body "Imports the pinned backend schema bundle and records its tag, commit, and SHA-256." \
            --base main \
            --head "$BRANCH_NAME"
